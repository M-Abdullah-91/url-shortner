<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snip — URL Shortener</title>
    <style>
        :root {
            --color-bg: #fafafa;
            --color-surface: #ffffff;
            --color-border: #e5e5e5;
            --color-border-subtle: #f0f0f0;
            --color-text-primary: #171717;
            --color-text-secondary: #525252;
            --color-text-tertiary: #a3a3a3;
            --color-accent: #2563eb;
            --color-accent-hover: #1d4ed8;
            --color-accent-subtle: #eff6ff;
            --color-success: #16a34a;
            --color-success-bg: #f0fdf4;
            --color-success-border: #bbf7d0;
            --color-error: #dc2626;
            --color-error-bg: #fef2f2;
            --color-error-border: #fecaca;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "SF Mono", SFMono-Regular, ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace;
            --radius-sm: 4px;
            --radius-md: 6px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --transition: 150ms ease;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            background: var(--color-bg);
            color: var(--color-text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* ---- Header ---- */
        .header {
            border-bottom: 1px solid var(--color-border);
            background: var(--color-surface);
        }

        .header-inner {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--color-text-primary);
        }

        .logo-mark {
            width: 24px;
            height: 24px;
            background: var(--color-text-primary);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-mark svg {
            width: 14px;
            height: 14px;
            color: var(--color-surface);
        }

        .logo-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .header-link {
            font-size: 13px;
            color: var(--color-text-tertiary);
            text-decoration: none;
            transition: color var(--transition);
        }

        .header-link:hover {
            color: var(--color-text-secondary);
        }

        /* ---- Main ---- */
        .main {
            max-width: 640px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }

        .page-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.025em;
            line-height: 1.2;
            color: var(--color-text-primary);
        }

        .page-description {
            margin-top: 6px;
            font-size: 15px;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        /* ---- Form ---- */
        .shorten-form {
            margin-top: 32px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        .url-input {
            flex: 1;
            height: 44px;
            padding: 0 14px;
            font-family: var(--font-sans);
            font-size: 14px;
            color: var(--color-text-primary);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            outline: none;
            transition: border-color var(--transition), box-shadow var(--transition);
        }

        .url-input::placeholder {
            color: var(--color-text-tertiary);
        }

        .url-input:focus {
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .submit-btn {
            height: 44px;
            padding: 0 20px;
            font-family: var(--font-sans);
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: var(--color-accent);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            white-space: nowrap;
            transition: background var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .submit-btn:hover {
            background: var(--color-accent-hover);
        }

        .submit-btn:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .submit-btn .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .submit-btn.loading .spinner {
            display: block;
        }

        .submit-btn.loading .btn-label {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ---- Result ---- */
        .result-panel {
            margin-top: 16px;
            border: 1px solid var(--color-success-border);
            background: var(--color-success-bg);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            display: none;
            animation: slideIn 0.2s ease;
        }

        .result-panel.visible {
            display: block;
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .result-header svg {
            width: 16px;
            height: 16px;
            color: var(--color-success);
            flex-shrink: 0;
        }

        .result-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--color-success);
        }

        .result-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
        }

        .result-url {
            flex: 1;
            min-width: 0;
        }

        .result-url a {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--color-accent);
            text-decoration: none;
            word-break: break-all;
        }

        .result-url a:hover {
            text-decoration: underline;
        }

        .copy-btn {
            height: 32px;
            padding: 0 12px;
            font-family: var(--font-sans);
            font-size: 12px;
            font-weight: 500;
            color: var(--color-text-secondary);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        .copy-btn:hover {
            background: var(--color-bg);
            border-color: #d4d4d4;
        }

        .copy-btn.copied {
            color: var(--color-success);
            border-color: var(--color-success-border);
        }

        /* ---- Error ---- */
        .error-panel {
            margin-top: 16px;
            border: 1px solid var(--color-error-border);
            background: var(--color-error-bg);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: none;
            font-size: 13px;
            color: var(--color-error);
            line-height: 1.5;
            animation: slideIn 0.2s ease;
        }

        .error-panel.visible {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .error-panel svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* ---- Footer ---- */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--color-surface);
            border-top: 1px solid var(--color-border-subtle);
            padding: 12px 24px;
            text-align: center;
        }

        .footer-text {
            font-size: 12px;
            color: var(--color-text-tertiary);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .main {
                padding: 32px 16px 80px;
            }

            .page-title {
                font-size: 22px;
            }

            .input-row {
                flex-direction: column;
            }

            .submit-btn {
                justify-content: center;
            }

            .header-inner {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-mark">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
                    </svg>
                </span>
                <span class="logo-text">Snip</span>
            </a>
            <a href="/api/docs/" class="header-link">API Docs</a>
        </div>
    </header>

    <main class="main">
        <h1 class="page-title">Shorten a link</h1>
        <p class="page-description">Paste a long URL below to create a shorter, shareable link.</p>

        <form class="shorten-form" id="shorten-form">
            <div class="input-row">
                <input
                    type="url"
                    class="url-input"
                    id="url-input"
                    placeholder="https://example.com/your-long-url"
                    required
                    autocomplete="url"
                    spellcheck="false"
                >
                <button type="submit" class="submit-btn" id="submit-btn">
                    <span class="btn-label">Shorten</span>
                    <span class="spinner"></span>
                </button>
            </div>
        </form>

        <div class="error-panel" id="error-panel" role="alert">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span id="error-text"></span>
        </div>

        <div class="result-panel" id="result-panel" role="status">
            <div class="result-header">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 6 9 17l-5-5"/>
                </svg>
                <span class="result-label">Link created</span>
            </div>
            <div class="result-row">
                <div class="result-url">
                    <a href="#" id="short-url-link" target="_blank" rel="noopener"></a>
                </div>
                <button type="button" class="copy-btn" id="copy-btn">
                    <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    <svg id="check-icon" style="display:none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6 9 17l-5-5"/>
                    </svg>
                    <span id="copy-label">Copy</span>
                </button>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p class="footer-text">Snip &mdash; open-source URL shortener</p>
    </footer>

    <script>
        const form = document.getElementById('shorten-form');
        const urlInput = document.getElementById('url-input');
        const submitBtn = document.getElementById('submit-btn');
        const resultPanel = document.getElementById('result-panel');
        const errorPanel = document.getElementById('error-panel');
        const errorText = document.getElementById('error-text');
        const shortUrlLink = document.getElementById('short-url-link');
        const copyBtn = document.getElementById('copy-btn');
        const copyLabel = document.getElementById('copy-label');
        const copyIcon = document.getElementById('copy-icon');
        const checkIcon = document.getElementById('check-icon');
        let currentShortUrl = '';
        let copyTimeout = null;

        function getCookie(name) {
            const cookies = document.cookie.split(';');
            for (let c of cookies) {
                c = c.trim();
                if (c.startsWith(name + '=')) {
                    return decodeURIComponent(c.substring(name.length + 1));
                }
            }
            return null;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = urlInput.value.trim();
            if (!url) return;

            submitBtn.disabled = true;
            submitBtn.classList.add('loading');
            resultPanel.classList.remove('visible');
            errorPanel.classList.remove('visible');

            try {
                const res = await fetch('/api/urls', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken') || '',
                    },
                    body: JSON.stringify({ original_url: url }),
                });

                const data = await res.json();

                if (res.ok) {
                    currentShortUrl = data.data.short_url;
                    shortUrlLink.href = currentShortUrl;
                    shortUrlLink.textContent = currentShortUrl;
                    resultPanel.classList.add('visible');
                    urlInput.value = '';
                    resetCopyState();
                } else {
                    let msg = 'Something went wrong. Please try again.';
                    if (data.original_url) {
                        msg = data.original_url.join(' ');
                    } else if (typeof data === 'object') {
                        const first = Object.values(data)[0];
                        msg = Array.isArray(first) ? first.join(' ') : String(first);
                    }
                    errorText.textContent = msg;
                    errorPanel.classList.add('visible');
                }
            } catch {
                errorText.textContent = 'Unable to reach the server. Check your connection and try again.';
                errorPanel.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('loading');
            }
        });

        copyBtn.addEventListener('click', () => {
            if (!currentShortUrl) return;
            navigator.clipboard.writeText(currentShortUrl).then(() => {
                copyLabel.textContent = 'Copied';
                copyIcon.style.display = 'none';
                checkIcon.style.display = 'block';
                copyBtn.classList.add('copied');
                clearTimeout(copyTimeout);
                copyTimeout = setTimeout(resetCopyState, 2000);
            });
        });

        function resetCopyState() {
            copyLabel.textContent = 'Copy';
            copyIcon.style.display = 'block';
            checkIcon.style.display = 'none';
            copyBtn.classList.remove('copied');
        }

        // Focus input on load
        urlInput.focus();
    </script>
</body>
</html>
